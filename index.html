<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Fußball">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Fußball</title>
<style>
:root { --paper: #ffffff; --desk: #e9edf2; --ink: #1d2a4a; --note: #5a6a86; --grid: #9db7d6; --rot: #d3261f; color-scheme: light; }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--desk); color: var(--ink);
  font: 20px "Comic Sans MS", "Segoe Print", "Chalkboard SE", cursive; padding: 16px; box-sizing: border-box; }
form { background: var(--paper); border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,.08); padding: 28px 24px; display: flex; flex-direction: column; gap: 14px; width: min(100%, 360px); box-sizing: border-box;
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 24px 24px; background-color: var(--paper); }
h1 { margin: 0; font-size: 30px; font-weight: 400; background: var(--paper); align-self: flex-start; padding: 0 4px; }
label { background: var(--paper); align-self: flex-start; padding: 0 4px; }
input { font: inherit; font-size: 22px; padding: 10px 12px; border: 3px solid var(--ink); border-radius: 8px; background: var(--paper); color: var(--ink); }
button { font: inherit; font-size: 22px; padding: 10px; border: 0; border-radius: 8px; background: var(--ink); color: var(--paper); cursor: pointer; }
button:focus-visible, input:focus-visible { outline: 3px solid var(--grid); outline-offset: 2px; }
#fehler { min-height: 1.3em; color: var(--rot); background: var(--paper); padding: 0 4px; margin: 0; align-self: flex-start; }
</style>
</head>
<body>
<form id="f">
  <h1>⚽ Fußball</h1>
  <label for="pw">Passwort</label>
  <input id="pw" type="password" autocomplete="current-password" autocapitalize="off" autocorrect="off" spellcheck="false" required>
  <button type="submit">Spielen</button>
  <p id="fehler" aria-live="polite"></p>
</form>

const bytes = s => Uint8Array.from(atob(s), ch => ch.charCodeAt(0));
async function oeffnen(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: bytes(DATEN.salt), iterations: 250000, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: "AES-GCM", iv: bytes(DATEN.iv) }, key, bytes(DATEN.text)));
  document.open(); document.write(html); document.close();
}
document.getElementById("f").addEventListener("submit", async e => {
  e.preventDefault();
  const pw = document.getElementById("pw").value.trim().toLowerCase();
  const fehler = document.getElementById("fehler");
  fehler.textContent = "Einen Moment …";
  try { await oeffnen(pw); try { localStorage.setItem("fussball-pw", pw); } catch (x) {} }
  catch (x) { fehler.textContent = "Das Passwort stimmt nicht. Bitte noch einmal versuchen."; }
});
// Passwort merken: beim nächsten Mal direkt ins Spiel
try { const pw = localStorage.getItem("fussball-pw"); if (pw) oeffnen(pw).catch(() => localStorage.removeItem("fussball-pw")); } catch (x) {}
